services:
  # Backend Python FastAPI Service
  - type: web
    name: gsk-mediaverse-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_SIZE_MB
        value: "200"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"

  # Integrated Full-Stack Node.js Service (Optional Alternative on Render)
  - type: web
    name: gsk-mediaverse-fullstack
    runtime: node
    region: oregon
    plan: free
    buildCommand: "echo 'Ready'"
    startCommand: "node server.js"
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MAX_UPLOAD_SIZE_MB
        value: "200"
